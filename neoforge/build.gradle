plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modCompileOnlyApi "mezz.jei:jei-$rootProject.minecraft_version-neoforge-api:$rootProject.jei_version"
    modRuntimeOnly "mezz.jei:jei-$rootProject.minecraft_version-neoforge:$rootProject.jei_version"

    modCompileOnlyApi "dev.architectury:architectury-neoforge:$rootProject.architectury_version"
    modCompileOnlyApi "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rootProject.rei_version"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rootProject.rei_version"

    modCompileOnly("dev.emi:emi-neoforge:$rootProject.emi_version:api")
    modLocalRuntime("dev.emi:emi-neoforge:$rootProject.emi_version")

    modCompileOnly "mekanism:Mekanism:$rootProject.mekanism_version"
    modRuntimeOnly "mekanism:Mekanism:$rootProject.mekanism_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
